[Mesh]
nx = 100
ny = 100
numghosts = 2
xlim = (0, 1)
ylim = (0, 1)

[Time]
time_steps = 50
method = RK1
t0 = 0
t_finish = 1
cfl = 0.5

[Fluid]
ics = diagonal_advection
system = mhd2d
gammas = [1.4]
mW = [28]

[Method]
flux = hlld
bcs_lo = (periodic, periodic)
bcs_hi = (periodic, periodic)
do_gravity = true

[Particle]
particle_ic = particleMethod
#number_of_particles = 0
#seeding_per_timestep = 0
#bounce_back_multiplier = 1.0
#max_number_of_bounces = 3

[Output]
output_freq = 1
#output_dir = ''
make_movie = true

