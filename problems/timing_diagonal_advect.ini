[Mesh]
nx = 250
ny = 250
numghosts = 2
xlim = (0, 1)
ylim = (0, 1)

[Time]
time_steps = 20
method = RK1
t0 = 0
t_finish = 1
cfl = 0.5

[Fluid]
fluid_ics = diagonal_advection
system = euler2d
gammas = [1.4]
mW = [28]

[Method]
flux = rusanov_vectorized
bcs_lo = (periodic, periodic)
bcs_hi = (periodic, periodic)

[Particle]
#particle_ic = particleMethod
#n_particles_per_cell = 0
#seeding_per_timestep = 0
#bounce_back_multiplier = 1.0
#max_number_of_bounces = 3

[Output]
output_freq = 100000
#output_dir = ''
make_movie = false

