[Mesh]
nx = 100
ny = 100
ng = 2
xlim = (0, 1)
ylim = (0, 1)

[Time]
time_steps = 500
method = RK1
t0 = 0
t_finish = 1
cfl = 0.5

[Fluid]
fluid_ics = diagonal_advection
system = euler2d
gammas = [1.4]
mW = [28]

[Method]
flux = hllc
bcs_lo = (periodic, periodic)
bcs_hi = (periodic, periodic)

[Particle]
; particle_ics = random
; n_ppc = 100
; flow_type = multispecies
; #seeding_per_timestep = 0
#bounce_back_multiplier = 1.0
#max_number_of_bounces = 3

[Fields]
E_ics = (1, 1, 1)
B_ics = (1, 1, 0)

[Output]
output_freq = 1
#output_dir = ''
make_movie = true

