[Mesh]
nx = 1000
ny = 1000
numghosts = 3
xlim = (0, 1)
ylim = (0, 1)

[Time]
time_steps = 99999999999
method = RK1
t0 = 0
t_finish = 2.5
cfl = 0.3

[Fluid]
fluid_ics = riemann_problem
system = euler2d
gammas = [1.4]
mW = [28]

[Method]
flux = rusanov_vectorized
bcs_lo = (periodic, periodic)
bcs_hi = (periodic, periodic)

[Fields]
E_ics = (1, 1, 1)
B_ics = (1, 1, 0)

[Output]
output_freq = 1
#output_dir = ''
make_movie = true



