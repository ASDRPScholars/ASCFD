[Mesh]
nx = 500
ny = 500
ng = 2
xlim = (0, 1)
ylim = (0, 1)

[Time]
time_steps = 500
method = RK1
t0 = 0
t_finish = 1
cfl = 0.9

[Fluid]
fluid_ics = riemann_problem
system = euler2d
gammas = [1.4]
mW = [28]

[Method]
flux = rusanov
bcs_lo = (neumann, neumann)
bcs_hi = (neumann, neumann)

[Particle]
particle_ics = particleMethod
#n_particles_per_cell = 0
#seeding_per_timestep = 0
#bounce_back_multiplier = 1.0
#max_number_of_bounces = 3

[Output]
output_freq = 1
#output_dir = ''
make_movie = true

