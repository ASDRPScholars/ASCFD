[Mesh]
nx = 100
ny = 100
numghosts = 2
xlim = (0, 1)
ylim = (0, 1)

[Time]
time_steps = 500
method = RK1
t0 = 0
t_finish = 5
cfl = 0.5

[Fluid]
ics = diagonal_advection
system = euler2D
gammas = [1.4]
mW = [28]

[Method]
flux = rusanov_vectorized
bcs_lo = (dirichlet, dirichlet)
bcs_hi = (dirichlet, dirichlet)

[Particle]
particle_ic = random_particles_with_condition
number_of_particles = 3
seeding_per_timestep = 5
bounce_back_multiplier = 10.0
max_number_of_bounces = 3

[Output]
output_freq = 4
#output_dir = ''
make_movie = true

