[Mesh]
nx = 100
ny = 40
ng = 2
xlim = (0, 1)
ylim = (0, 0.4)

[Time]
time_steps = 3000
method = RK1
t0 = 0
t_finish = 10
cfl = 0.1

[Fluid]
fluid_ics = tame_static
system = euler2d
gammas = [1.4]
mW = [28]

[Method]
flux = rusanov_vectorized
bcs_lo = (neumann, neumann)
bcs_hi = (tame_inflow, neumann)

[Particle]
particle_ics = random
n_ppc = 10
flow_type = multispecies
#seeding_per_timestep = 0
#bounce_back_multiplier = 1.0
#max_number_of_bounces = 3

[Fields]
E_ics = pass
B_ics = guillaume

[Output]
output_freq = 5
#output_dir = ''
make_movie = true

