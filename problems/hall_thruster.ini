[Mesh]
nx = 100
ny = 100
numghosts = 2
xlim = (0, 1)
ylim = (0, 1)

[Time]
time_steps = 500
method = RK1
t0 = 0
t_finish = 1
cfl = 0.9

[Fluid]
fluid_ics = diagonal_advection
system = hallthruster_rz
gammas = [1.4]
mW = [28]

[Method]
flux = rusanov
bcs_lo = (periodic, periodic)
bcs_hi = (periodic, periodic)

[Particle]
particle_ics = random
n_particles_per_cell = 100
flow_type = multispecies
#seeding_per_timestep = 0
#bounce_back_multiplier = 1.0
#max_number_of_bounces = 3

[Fields]
E_ics = pass
B_ics = guillaume

[Output]
output_freq = 1
#output_dir = ''
make_movie = true

