[Mesh]
nx = 100
ny = 40
ng = 2
# get real dimensions to work here + in plasma_refs...
xlim = (0, 0.001)
ylim = (0, 0.0004)

[Time]
time_steps = 3000
method = RK1
t0 = 0
t_finish = 10
cfl = 0.2

[Fluid]
; fluid_ics = tame_static
density = 9.10938e-13
pressure = 1.6021766
system = euler2d
gammas = [1.4]
mW = [28]

[Method]
flux = rusanov_vectorized
bcs_lo = (neumann, neumann)
bcs_hi = (neumann, neumann)

[Particle]
; particle_ics = random
; n_ppc = 10
; flow_type = multispecies
#seeding_per_timestep = 0
#bounce_back_multiplier = 1.0
#max_number_of_bounces = 3

[Fields]
V_anode = 0
V_cathode = 3
B_ics = guillaume
B_max = 0.01

[Parameters]
charge = 1.602e-19
e_mass = 9.10938e-31
i_mass = 2.18e-25
n_mass = 2.18e-25

[Output]
output_freq = 1
#output_dir = ''
make_movie = true
2d_data = rho_e, p_e, u_e, v_e, w_e, charge_density, potential, Ex, Ey, By
