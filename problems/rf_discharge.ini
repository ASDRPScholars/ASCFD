# BASED ON LANDMARK 1D AXIAL HYBRID BENCHMARK:

[Mesh]
nx = 800
ny = 1
ng = 0
# get real dimensions to work here + in plasma_refs...
xlim = (0, 0.067)
ylim = (0, 0.00008375)

[Time]
time_steps = 3000
method = RK1
t0 = 0
t_finish = 10
cfl = 0.7
# For RF discharge: fRF = 13.56 MHz → TRF = 74 ns period
# Timestep considerations:
#   - CFL-limited dt typically ranges 2e-11 to 2e-12 s (depending on flow conditions)
#   - For 4 solutions per RF period: sample every Δt_sample = 1.843657e-8 s (TRF/4)
#   - You can use a constant dt for simplicity, but ensure dt << TRF for accurate RF resolution
#   - Recommended: dt ~ 1e-11 s (gives ~7400 steps per RF period, very well resolved)
#   - For post-processing: output_freq should give snapshots at multiples of Δt_sample
dt = 1e-11

[Fluid]
fluid_ics = rf
density = 9.10938e-13
pressure = 1.6021766
system = euler2d
gammas = [1.4]
mW = [28]

[Particle]
# General
particle_ics = random
n_ppc = 85
flow_type = multispecies

# Neutrals
n_mass = 2.18e-25 # kg
; n_n_anode = 3.2e19
; n_n_downstream = 1.6e19 
v_n = 150
n_flow_rate = 5e-6

# Misc
#seeding_per_timestep = 0
#bounce_back_multiplier = 1.0
#max_number_of_bounces = 3


[Method]
flux = rusanov
bcs_lo = (neumann, periodic)
bcs_hi = (neumann, periodic)


[Fields]
V_anode = 300
V_cathode = 0
B_ics = guillaume
B_max = 0.015
# RF discharge parameters
rf_frequency = 13.56e6  # 13.56 MHz
rf_amplitude = 450      # 450 V amplitude
rf_boundary = right     # which boundary oscillates (right, left, anode, cathode)

[Parameters]
charge = 1.602e-19
e_mass = 9.10938e-31
i_mass = 2.18e-25
n_mass = 2.18e-25

[Output]
output_freq = 1
#output_dir = ''
make_movie = true
2d_data = n_e, p_e, u_e, w_e, rho_q, phi, Ex, By, rho_n, i, rho_i, n
