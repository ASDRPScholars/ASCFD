[Mesh]
nx = 100
ny = 100
numghosts = 2
xlim = (0, 1)
ylim = (0, 1)

[Time]
time_steps = 1000
method = RK1
t0 = 0
t_finish = 5
cfl = 0.5

[Fluid]
ics = static
system = euler2D
gammas = [1.4]
mW = [28]

[Method]
flux = rusanov_vectorized
bcs_lo = (double_inflow, dirichlet)
bcs_hi = (dirichlet, dirichlet)

[Particle]
particle_ic = particleMethod
#number_of_particles = 0
#seeding_per_timestep = 0
#bounce_back_multiplier = 1.0
#max_number_of_bounces = 3

[Output]
output_freq = 1
#output_dir = ''
make_movie = true

