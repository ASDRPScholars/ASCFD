[Mesh]
nx = 200
ny = 200
numghosts = 2
xlim = (0, 1)
ylim = (0, 1)

[Time]
time_steps = 100
method = RK1
t0 = 0
t_finish = 2
cfl = 0.9

[Fluid]
ics = rotor
system = mhd2d
gammas = [1.4]
mW = [28]

[Method]
flux = hlld_new
bcs_lo = (periodic, periodic)
bcs_hi = (periodic, periodic)

[Particle]
particle_ic = random_particles_with_condition
number_of_particles = 3
seeding_per_timestep = 5
bounce_back_multiplier = 10.0
max_number_of_bounces = 3

[Output]
output_freq = 4
make_movie = true