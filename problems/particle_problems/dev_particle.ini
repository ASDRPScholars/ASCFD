[Mesh]
nx = 500
ny = 500
numghosts = 2
xlim = (0, 1)
ylim = (0, 1)

[Time]
time_steps = 500
method = RK1
t0 = 0
t_finish = 1
cfl = 0.9

[Fluid]
ics = riemann_problem
system = euler2D
gammas = [1.4]
mW = [28]

[Method]
flux = rusanov
bcs_lo = (neumann, neumann)
bcs_hi = (neumann, neumann)

[Particle]
particle_ic = random_along_left_wall
number_of_particles = 3
seeding_per_timestep = 5
bounce_back_multiplier = 10.0
max_number_of_bounces = 3

[Output]
output_freq = 1
#output_dir = ''
make_movie = true

