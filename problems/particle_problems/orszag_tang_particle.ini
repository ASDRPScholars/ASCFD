[Mesh]
nx = 1000
ny = 1000
numghosts = 2
xlim = (0, 1)
ylim = (0, 1)

[Time]
time_steps = 1000
method = RK1
t0 = 0
t_finish = 1
cfl = 0.9

[Fluid]
ics = orszag_tang
system = mhd2d
gammas = [1.667]
mW = [28]

[Method]
flux = hlld_new
bcs_lo = (periodic, periodic)
bcs_hi = (periodic, periodic)

[Particle]
particle_ic = random_particles_with_condition
number_of_particles = 3
seeding_per_timestep = 5
bounce_back_multiplier = 10.0
max_number_of_bounces = 3

[Output]
output_freq = 1
#output_dir = ''
make_movie = true