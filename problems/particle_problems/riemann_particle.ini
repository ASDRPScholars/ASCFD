[Mesh]
nx = 1000
ny = 1000
numghosts = 3
xlim = (0, 1)
ylim = (0, 1)

[Time]
time_steps = 99999999999
method = RK1
t0 = 0
t_finish = 2.5
cfl = 0.3

[Fluid]
ics = riemann_problem
system = euler2D
gammas = [1.4]
mW = [28]

[Method]
flux = hllc
bcs_lo = (dirichlet, dirichlet)
bcs_hi = (dirichlet, dirichlet)

[Particle]
particle_ic = random_particles_with_condition
number_of_particles = 3
seeding_per_timestep = 5
bounce_back_multiplier = 10.0
max_number_of_bounces = 3

[Output]
output_freq = 10
#output_dir = ''
make_movie = true



