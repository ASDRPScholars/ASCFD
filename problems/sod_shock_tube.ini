# SOD SHOCK TUBE - Classic 1D Riemann Problem
# This is a standard test case for compressible Euler solvers
# Initial discontinuity at x=0.5 evolves into shock, contact, and rarefaction

[Mesh]
nx = 400
ny = 1
ng = 2
xlim = (0, 1.0)
ylim = (0, 0.01)

[Time]
time_steps = 1000
method = RK1
t0 = 0
t_finish = 0.2
cfl = 0.4
dt = 1e-4

[Electrons]
ics = sod
system = euler1d
gammas = [1.4]

[Method]
flux = hllc
bcs_lo = (neumann, periodic)
bcs_hi = (neumann, periodic)

[Output]
output_freq = 10
make_movie = true
2d_data = n_e, p_e, u_e, rho_e
