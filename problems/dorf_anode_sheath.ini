[Mesh]
# Axial × radial cross section. Channel width H_ch ≈ 1.8 cm (paper).
nx = 200
ny = 40
ng = 2
xlim = (0.0, 0.018)      # 0 → anode, 1.8 cm downstream
ylim = (0.0, 0.018)      # 1.8 cm radial span (simple rectangle)

[Time]
time_steps = 3000
method = RK1
t0 = 0
t_finish = 3e-4          # 0.3 ms demoextend as needed
cfl = 0.2
dt = 1e-7

[Fluid]
system = euler2d
# Simple uniform electron fluid start; Te ≈ 20 eV near anode (paper assumption).
# We'll encode this as pressure via p = n k_B T; in code units you can start modest.
density = 1.0e18         # m^-3 (pick a reasonable seed)
pressure = 3.2e-1        # arbitrary units; tune to keep numerics stable
gammas = [1.667]         # monatomic
u = [0.0]                # axial vel seed
v = [0.0]                # radial vel seed
w = [0.0]                # z/θ vel seed
fluid_ics = tame_static  # calm start

[Method]
flux = rusanov
# Quasi-1D-ish walls: Neumann for electron fluid on anode & walls (paper uses this spirit).
bcs_lo = (neumann, neumann)   # x=0 (anode), y=0
bcs_hi = (neumann, neumann)   # x=L,   y=H

[Particle]
# Neutrals injected from the anode side with mass flow \dot{m} (paper: 1.7–3.0 mg/s)
particle_ics = random
flow_type = multispecies
n_ppc = 50
n_flow_rate = 1.7e-6     # kg/s  (set to 3.0e-6 for the higher flow case)
v_n = 150                # m/s neutral drift (OK as a seed)
# Species masses (xenon)
# These are taken from Parameters below via inputs; shown here just for context.

[Fields]
# Poisson solve for electrostatics with Dirichlet anode/cathode potentials.
# Paper’s constraint is w_anode - w_cathode = V_d (discharge voltage). 
# We'll set anode at +Vd and cathode at 0 for clarity.
B_ics = guillaume
B_max = 0.015            # 0.015–0.02 T is a good starting range
V_anode = 226            # change to 273 for the high-Vd case
V_cathode = 0

[Parameters]
charge = 1.602e-19
e_mass = 9.10938e-31
i_mass = 2.18e-25        # Xe+
n_mass = 2.18e-25        # Xe neutrals

[Output]
output_freq = 50
make_movie = false
2d_data = n_e, p_e, u_e, w_e, rho_q, phi, Ex, By, rho_n, i, rho_i, n